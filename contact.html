<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Contact – Alana Prato-Shein Therapy</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action https://formspree.io; base-uri 'self';">
</head>
<body class="page-contact">

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="logofinal.png" alt="Alana Prato-Shein Therapy">
            </a>
        </div>

        <nav>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="faqs.html">FAQs</a>
            <a href="resources.html">Resources</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Contact</h1>

        <p class="contact-intro">I do my best to respond within two business days. If you have not heard back from me within two business days, please check your spam folder as sometimes my replies end up there!</p>

        <form class="contact-form" method="POST" action="https://formspree.io/f/mlgkorbk">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off">

            <button type="submit" class="form-submit">Send Message</button>

        </form>
    </main>

</body>
</html>
